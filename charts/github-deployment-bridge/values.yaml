# Must stay 1 when persistence is enabled. The chart fails helm template when
# replicaCount > 1 with a PVC; SQLite is single-writer only (see docs/install/persistence.md).
replicaCount: 1

image:
  repository: ghcr.io/roberteggl/github-deployment-bridge
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra labels applied to all chart resources (merged into the standard label set).
commonLabels: {}
# Extra labels applied only to the pod template (in addition to commonLabels).
podLabels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

# Opt-in NetworkPolicy. Default false so installs stay compatible with clusters
# that lack NetworkPolicy support or do not use default-deny CNIs.
networkPolicy:
  enabled: false
  ingress:
    # Optional peers allowed to scrape metrics / hit probes. Empty = any pod.
    # Example: [{ namespaceSelector: { matchLabels: { name: monitoring } } }]
    metricsFrom: []
  egress:
    allowDNS: true
    # GitHub API, GHES, OCI registries (hosts are not enumerable).
    allowHTTPS: true
    # Kubernetes API (controller watches). Default :6443 covers common
    # distributions; in-cluster API on :443 is already allowed by allowHTTPS.
    # Destination is not CIDR-scoped - tighten via extraEgress if required.
    allowKubeAPI: true
    kubeAPIPorts:
      - 6443
    # Extra egress rules appended as-is under egress.
    extraEgress: []

# Opt-in Prometheus Operator ServiceMonitor. Requires the monitoring.coreos.com
# CRDs. /metrics is unauthenticated HTTP - pair with networkPolicy + metricsFrom
# when the CNI enforces NetworkPolicy.
serviceMonitor:
  enabled: false
  # Extra labels so a Prometheus instance's serviceMonitorSelector matches
  # (e.g. { release: kube-prometheus-stack }).
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  honorLabels: false
  metricRelabelings: []
  relabelings: []

# Opt-in PrometheusRule. Requires monitoring.coreos.com CRDs and (for the
# NotReady alert) kube-state-metrics. Pair with serviceMonitor.enabled so app
# metrics exist; match ruleSelector via labels.
prometheusRule:
  enabled: false
  labels: {}
  annotations: {}
  # Published runbook; override if you mirror docs.
  runbookURL: https://deployment-bridge.eggl.dev/operations/runbook
  # rate(github_api_failures_total[15m]) threshold
  githubAPIFailureRate: 0
  # histogram_quantile(0.99, …) threshold in seconds
  githubAPILatencyP99Seconds: 5

# Keep prometheus.io/port in sync with containerPorts.metrics when using
# annotation-based discovery (ServiceMonitor scrapes the Service instead).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Container listen ports (NetworkPolicy matches these, not service.*Port).
containerPorts:
  metrics: 8080
  probes: 8081

service:
  type: ClusterIP
  # Published Service ports (targetPort uses the named container ports above).
  metricsPort: 8080
  probePort: 8081

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  # Keep enabled in production. When false, /data uses emptyDir and the SQLite
  # cache is lost on reschedule (duplicate GitHub Deployments may be created).
  enabled: true
  size: 1Gi
  storageClass: ""
  # ReadWriteOnce is the production default. replicaCount must stay 1 even with
  # ReadWriteMany - SQLite does not support safe multi-writer semantics (enforced).
  accessMode: ReadWriteOnce

# Bridge configuration
config:
  clusterName: production
  environment: production
  watchNamespace: ""
  environmentURL: ""
  # Optional default GitHub Deployment description (overridable per workload).
  # Empty falls back to "Deployed by FluxCD".
  description: ""
  # Optional GitHub Deployment Status log_url template. Placeholders:
  # {sha} {namespace} {name} {service} ({service} falls back to {name})
  # {environment} {cluster}. Per-workload annotation log-url overrides this
  # and supports the same placeholders.
  logURLTemplate: ""
  # Percent-encode every substituted placeholder value. The default false
  # preserves the historical literal-substitution behavior.
  logURLTemplateEscape: false
  # slog level: debug | info | warn | error
  logLevel: info
  leaderElection: true
  githubBaseURL: ""
  # GitHub API and OCI registry retry backoff (maps to RETRY_* env vars).
  retry:
    maxAttempts: 5
    # Go duration strings, e.g. 500ms, 1s, 30s
    initialBackoff: 500ms
    maxBackoff: 30s

github:
  # Name of an existing Secret containing:
  #   app-id, installation-id, private-key
  existingSecret: ""
  # Or provide values directly. Requires allowInsecureValues=true because the
  # PEM is stored in the Helm release Secret (sh.helm.release.v1.*) as well as
  # the chart-managed Secret - not recommended for production.
  allowInsecureValues: false
  appId: ""
  installationId: ""
  # PEM contents of the GitHub App private key.
  privateKey: ""

# Private OCI registries (e.g. GHCR). Used when inspecting workload image
# labels - separate from imagePullSecrets (which only pull this chart's image).
registry:
  # Existing kubernetes.io/dockerconfigjson Secret (often the same one Flux uses).
  existingDockerConfigSecret: ""
  # Key inside the Secret; default matches kubernetes.io/dockerconfigjson.
  dockerConfigKey: ".dockerconfigjson"

probes:
  liveness:
    path: /healthz
    port: probes
  readiness:
    path: /readyz
    port: probes
