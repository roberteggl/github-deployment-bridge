{{- if .Values.rbac.create }}
{{- $watchNS := .Values.config.watchNamespace | default "" }}
{{- $clusterWatch := eq $watchNS "" }}
{{- /* Watch / inventory rules: ClusterRole when watching all namespaces,
       namespaced Role in config.watchNamespace otherwise.
       Leader-election leases always use a Role in the release namespace. */}}
# SPDX-FileCopyrightText: 2026 Robert Eggl <robert@eggl.dev>
#
# SPDX-License-Identifier: Apache-2.0
{{- if $clusterWatch }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "github-deployment-bridge.fullname" . }}
  labels:
    {{- include "github-deployment-bridge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "github-deployment-bridge.fullname" . }}
  labels:
    {{- include "github-deployment-bridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "github-deployment-bridge.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "github-deployment-bridge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "github-deployment-bridge.fullname" . }}
  namespace: {{ $watchNS }}
  labels:
    {{- include "github-deployment-bridge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "github-deployment-bridge.fullname" . }}
  namespace: {{ $watchNS }}
  labels:
    {{- include "github-deployment-bridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "github-deployment-bridge.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "github-deployment-bridge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "github-deployment-bridge.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-deployment-bridge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "github-deployment-bridge.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-deployment-bridge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "github-deployment-bridge.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "github-deployment-bridge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
