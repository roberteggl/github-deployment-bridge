{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "github-deployment-bridge.fullname" . }}
  labels:
    {{- include "github-deployment-bridge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "github-deployment-bridge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Match container listen ports (not service.*Port - those are Service-facing).
    - ports:
        - protocol: TCP
          port: {{ .Values.containerPorts.metrics }}
        - protocol: TCP
          port: {{ .Values.containerPorts.probes }}
      {{- with .Values.networkPolicy.ingress.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowHTTPS }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowKubeAPI }}
    - ports:
        {{- range .Values.networkPolicy.egress.kubeAPIPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
