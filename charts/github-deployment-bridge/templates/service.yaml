apiVersion: v1
kind: Service
metadata:
  name: {{ include "github-deployment-bridge.fullname" . }}
  labels:
    {{- include "github-deployment-bridge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
    - name: probes
      port: {{ .Values.service.probePort }}
      targetPort: probes
      protocol: TCP
  selector:
    {{- include "github-deployment-bridge.selectorLabels" . | nindent 4 }}
