name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_PATH: charts/github-deployment-bridge

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          mapfile -t files < <(find . -name '*.go' -not -path './vendor/*')
          test -z "$(gofmt -l "${files[@]}")"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: make build

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3 # helm

      - name: Lint chart
        run: |
          helm lint "${CHART_PATH}" \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key

      - name: Verify chart version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          chart_version="$(awk '/^version:/ {print $2; exit}' "${CHART_PATH}/Chart.yaml" | tr -d '"')"
          app_version="$(awk '/^appVersion:/ {print $2; exit}' "${CHART_PATH}/Chart.yaml" | tr -d '"')"
          echo "tag=${tag} chart=${chart_version} app=${app_version}"
          test "${chart_version}" = "${tag}"
          test "${app_version}" = "${tag}"

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  changelog:
    name: Changelog
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release metadata
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

  # Native multi-arch: amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm (no QEMU).
  image:
    name: Image (${{ matrix.name }})
    needs: changelog
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=github-deployment-bridge
            org.opencontainers.image.description=Bridge FluxCD reconciliations to GitHub Deployments
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.changelog.outputs.version }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-${{ env.PLATFORM_PAIR }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    name: Merge multi-arch image
    needs: [changelog, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ needs.changelog.outputs.is_prerelease == 'false' && !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ needs.changelog.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=github-deployment-bridge
            org.opencontainers.image.description=Bridge FluxCD reconciliations to GitHub Deployments
            org.opencontainers.image.licenses=Apache-2.0

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            tags+=("-t" "${tag}")
          done < <(jq -cr '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          digests=()
          for digest_file in *; do
            digests+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest_file}")
          done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"

      - name: Inspect image
        id: digest
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.changelog.outputs.version }}"
          docker buildx imagetools inspect "${image}"
          digest="$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}')"
          if [[ -z "${digest}" || "${digest}" == "<no value>" ]]; then
            digest="$(docker buildx imagetools inspect "${image}" | awk '/^Digest:/ {print $2; exit}')"
          fi
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}"

  helm:
    name: Helm chart
    needs: [changelog, merge-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      package: ${{ steps.package.outputs.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3 # helm

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "${CHART_PATH}" \
            --version "${{ needs.changelog.outputs.version }}" \
            --app-version "${{ needs.changelog.outputs.version }}" \
            --destination dist
          file="$(ls dist/*.tgz)"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          echo "basename=$(basename "${file}")" >> "$GITHUB_OUTPUT"

      - name: Push chart OCI
        run: |
          helm push "dist/${{ steps.package.outputs.basename }}" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart
          path: ${{ steps.package.outputs.file }}
          retention-days: 30

  release:
    name: GitHub Release
    needs: [changelog, merge-image, helm]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Helm chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-chart
          path: dist

      - name: Write release notes
        env:
          BODY: ${{ needs.changelog.outputs.release_body }}
        run: |
          set -euo pipefail
          {
            echo "${BODY}"
            echo
            echo "## Artifacts"
            echo
            echo "- Container image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.changelog.outputs.version }}\`"
            echo "- Image digest: \`${{ needs.merge-image.outputs.digest }}\`"
            echo "- Helm chart (OCI): \`oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/github-deployment-bridge:${{ needs.changelog.outputs.version }}\`"
            echo
            echo "Image is signed with Sigstore keyless Cosign."
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          prerelease: ${{ needs.changelog.outputs.is_prerelease }}
          generate_release_notes: false
          files: dist/*.tgz
