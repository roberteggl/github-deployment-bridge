name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          mapfile -t files < <(find . -name '*.go' -not -path './vendor/*')
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: make build

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2 # golangci-lint

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run govulncheck
        id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload SARIF
        if: always() && hashFiles('govulncheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        continue-on-error: true
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  helm:
    name: Helm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4 # helm

      - name: Lint chart
        run: |
          helm lint charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true

      - name: Template chart
        run: |
          helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true \
            --set config.clusterName=ci \
            --set config.environment=staging \
            >/dev/null

      - name: Reject unsafe multi-replica PVC config
        run: |
          if helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true \
            --set replicaCount=2 \
            >/dev/null 2>&1; then
            echo "expected helm template to fail when replicaCount > 1 with PVC"
            exit 1
          fi
          if helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true \
            --set replicaCount=2 \
            --set persistence.accessMode=ReadWriteMany \
            >/dev/null 2>&1; then
            echo "expected helm template to fail when replicaCount > 1 with RWX PVC"
            exit 1
          fi

      - name: Template namespaced RBAC, NetworkPolicy, ServiceMonitor
        run: |
          out="$(helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true \
            --set config.watchNamespace=flux-system \
            --set networkPolicy.enabled=true \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.labels.release=kube-prometheus-stack \
            --set prometheusRule.enabled=true \
            --set prometheusRule.labels.release=kube-prometheus-stack \
            --set config.retry.maxAttempts=8 \
            --set config.retry.initialBackoff=1s \
            --set config.retry.maxBackoff=60s)"
          echo "${out}" | grep -q 'kind: Role'
          echo "${out}" | grep -q 'leader-election'
          echo "${out}" | grep -q 'kind: NetworkPolicy'
          echo "${out}" | grep -q 'kind: ServiceMonitor'
          echo "${out}" | grep -q 'kind: PrometheusRule'
          echo "${out}" | grep -q 'alert: GitHubDeploymentBridgeNotReady'
          echo "${out}" | grep -q 'alert: GitHubDeploymentBridgeErrors'
          echo "${out}" | grep -q 'port: metrics'
          echo "${out}" | grep -q 'release: kube-prometheus-stack'
          # Regression: {{- … -}} before apiVersion must not glue SPDX onto the field,
          # and disabled templates must not emit comment-only YAML documents.
          if echo "${out}" | grep -q 'Apache-2.0apiVersion'; then
            echo "SPDX comment glued onto apiVersion (Helm whitespace trim bug)"
            exit 1
          fi
          echo "${out}" | awk '
            BEGIN { doc=""; n=0 }
            /^---$/ {
              if (n++) check(doc)
              doc=""
              next
            }
            { doc = doc $0 "\n" }
            END { check(doc) }
            function check(d,   has_api, has_kind, line, emptyish) {
              gsub(/\r/, "", d)
              emptyish = 1
              has_api = 0
              has_kind = 0
              split(d, lines, "\n")
              for (i in lines) {
                line = lines[i]
                sub(/^[[:space:]]+/, "", line)
                if (line == "" || line ~ /^#/) continue
                emptyish = 0
                if (line ~ /^apiVersion:/) has_api = 1
                if (line ~ /^kind:/) has_kind = 1
              }
              if (emptyish) return
              if (!has_api || !has_kind) {
                print "document missing apiVersion/kind:" > "/dev/stderr"
                print d > "/dev/stderr"
                exit 1
              }
            }
          '
          echo "${out}" | awk '
            /apiVersion: monitoring.coreos.com\/v1/ { api=1; next }
            api && /^kind: PrometheusRule$/ { found=1; exit }
            /^---$/ { api=0 }
            END { if (!found) { print "expected PrometheusRule with apiVersion monitoring.coreos.com/v1" > "/dev/stderr"; exit 1 } }
          '
          echo "${out}" | grep -q 'name: RETRY_MAX_ATTEMPTS'
          echo "${out}" | grep -q 'value: "8"'
          echo "${out}" | grep -q 'name: RETRY_INITIAL_BACKOFF'
          echo "${out}" | grep -q 'value: "1s"'
          echo "${out}" | grep -q 'name: RETRY_MAX_BACKOFF'
          echo "${out}" | grep -q 'value: "60s"'
          # NetworkPolicy: kube-API egress (C1) + container listen ports (H1)
          echo "${out}" | grep -q 'port: 6443'
          echo "${out}" | grep -A2 'METRICS_ADDR' | grep -q 'value: ":8080"'
          ports_skew="$(helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true \
            --set networkPolicy.enabled=true \
            --set containerPorts.metrics=9090 \
            --set containerPorts.probes=9091 \
            --set service.metricsPort=18080 \
            --set service.probePort=18081)"
          echo "${ports_skew}" | grep -q 'containerPort: 9090'
          echo "${ports_skew}" | grep -q 'containerPort: 9091'
          echo "${ports_skew}" | grep -A2 'METRICS_ADDR' | grep -q 'value: ":9090"'
          echo "${ports_skew}" | grep -A2 'PROBE_ADDR' | grep -q 'value: ":9091"'
          # NP must allow pod ports, not Service published ports
          np_skew="$(echo "${ports_skew}" | awk '/kind: NetworkPolicy/,/^---$/')"
          echo "${np_skew}" | grep -q 'port: 9090'
          echo "${np_skew}" | grep -q 'port: 9091'
          if echo "${np_skew}" | grep -q 'port: 18080'; then
            echo "NetworkPolicy must not use service.metricsPort for pod ingress"
            exit 1
          fi
          if echo "${np_skew}" | grep -q 'port: 18081'; then
            echo "NetworkPolicy must not use service.probePort for pod ingress"
            exit 1
          fi
          no_kubeapi="$(helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true \
            --set networkPolicy.enabled=true \
            --set networkPolicy.egress.allowKubeAPI=false)"
          np_no_kubeapi="$(echo "${no_kubeapi}" | awk '/kind: NetworkPolicy/,/^---$/')"
          if echo "${np_no_kubeapi}" | grep -q 'port: 6443'; then
            echo "expected no kube-API :6443 when allowKubeAPI=false"
            exit 1
          fi
          if echo "${out}" | grep -q 'kind: ClusterRole'; then
            echo "expected no ClusterRole when watchNamespace is set"
            exit 1
          fi
          default="$(helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true)"
          if echo "${default}" | grep -q 'kind: ServiceMonitor'; then
            echo "expected no ServiceMonitor when serviceMonitor.enabled is false"
            exit 1
          fi
          if echo "${default}" | grep -q 'kind: PrometheusRule'; then
            echo "expected no PrometheusRule when prometheusRule.enabled is false"
            exit 1
          fi
          echo "${default}" | grep -q 'name: RETRY_MAX_ATTEMPTS'
          echo "${default}" | grep -q 'value: "5"'
          # H2: checksum annotations for rollout
          echo "${default}" | grep -q 'checksum/config'
          echo "${default}" | grep -q 'checksum/secret'
          existing="$(helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.existingSecret=github-deployment-bridge)"
          echo "${existing}" | grep -q 'checksum/config'
          if echo "${existing}" | grep -q 'checksum/secret'; then
            echo "checksum/secret must be omitted when github.existingSecret is set"
            exit 1
          fi
          # H3: values.schema.json rejects invalid enums / unknown keys
          if helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true \
            --set config.logLevel=verbose \
            >/dev/null 2>&1; then
            echo "expected helm template to fail for invalid config.logLevel"
            exit 1
          fi
          if helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            --set github.allowInsecureValues=true \
            --set notARealValue=true \
            >/dev/null 2>&1; then
            echo "expected helm template to fail for unknown top-level value"
            exit 1
          fi
          # H5: inline credentials require allowInsecureValues
          if helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.appId=1 \
            --set github.installationId=1 \
            --set github.privateKey=ci-fake-key \
            >/dev/null 2>&1; then
            echo "expected helm template to fail without github.allowInsecureValues"
            exit 1
          fi
          # H6: pod template gets full label set; selectors stay stable
          echo "${default}" | grep -q 'app.kubernetes.io/component: controller'
          echo "${default}" | grep -q 'helm.sh/chart:'
          labels="$(helm template github-deployment-bridge charts/github-deployment-bridge \
            --set github.existingSecret=github-deployment-bridge \
            --set commonLabels.team=platform \
            --set podLabels.role=bridge)"
          echo "${labels}" | grep -q 'team: platform'
          echo "${labels}" | grep -q 'role: bridge'
          dep_sel="$(echo "${labels}" | awk '/kind: Deployment/,/^---$/' | awk '/selector:/,/template:/')"
          if echo "${dep_sel}" | grep -q 'app.kubernetes.io/version'; then
            echo "Deployment selector must not include version labels"
            exit 1
          fi
          if echo "${dep_sel}" | grep -q 'helm.sh/chart'; then
            echo "Deployment selector must not include chart labels"
            exit 1
          fi
          if echo "${dep_sel}" | grep -q 'team: platform'; then
            echo "Deployment selector must not include commonLabels"
            exit 1
          fi

  container:
    name: Container (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: github-deployment-bridge:ci-${{ matrix.name }}
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

      # SHA-pin trivy-action (post March 2026 supply-chain incident). Also pin
      # the Trivy binary version so Renovate can bump it independently.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: github-deployment-bridge:ci-${{ matrix.name }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.73.0 # trivy

  reuse:
    name: REUSE
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
